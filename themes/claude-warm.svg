  <rect width="960" height="560" rx="24" fill="#302d2b"/>
  <rect x="0" y="0" width="190" height="560" rx="24" fill="#302d2b"/>
  <rect x="24" y="28" width="142" height="10" rx="5" fill="#c57b60"/>
  <rect x="24" y="68" width="130" height="12" rx="6" fill="#f4eee5" opacity=".7"/>
  <rect x="24" y="104" width="108" height="12" rx="6" fill="#f4eee5" opacity=".3"/>
