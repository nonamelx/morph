<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">VOID / 無名 theme preview</title>
  <desc id="desc">Illustrative palette preview, not a Codex screenshot. Near-black graphite with a restrained dark red accent.</desc>
  <rect width="960" height="560" rx="24" fill="#181819"/>
  <rect x="0" y="0" width="190" height="560" rx="24" fill="#181819"/>
  <rect x="24" y="28" width="142" height="10" rx="5" fill="#bb6a6a"/>
  <rect x="24" y="68" width="130" height="12" rx="6" fill="#e2dddd" opacity=".7"/>
  <rect x="24" y="104" width="108" height="12" rx="6" fill="#e2dddd" opacity=".3"/>
  <rect x="24" y="144" width="122" height="12" rx="6" fill="#e2dddd" opacity=".3"/>
  <rect x="24" y="184" width="94" height="12" rx="6" fill="#e2dddd" opacity=".3"/>
  <text x="230" y="76" font-family="Segoe UI, sans-serif" font-size="20" fill="#e2dddd">MORPH / ILLUSTRATION</text>
  <text x="230" y="132" font-family="Segoe UI, sans-serif" font-size="36" font-weight="600" fill="#e2dddd">VOID / 無名</text>
  <text x="230" y="168" font-family="Segoe UI, sans-serif" font-size="17" fill="#e2dddd" opacity=".72">Near-black graphite with a restrained dark red accent.</text>
  <rect x="230" y="210" width="670" height="200" rx="18" fill="#e2dddd" opacity=".06" stroke="#e2dddd" stroke-opacity=".14"/>
  <text x="260" y="252" font-family="Segoe UI, sans-serif" font-size="16" fill="#e2dddd" opacity=".76">Appearance preview</text>
  <text x="260" y="302" font-family="Segoe UI, sans-serif" font-size="22" fill="#e2dddd">A calm workspace for your next idea.</text>
  <rect x="260" y="338" width="158" height="42" rx="10" fill="#bb6a6a"/>
  <text x="283" y="365" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#181819">Continue</text>
  <rect x="440" y="338" width="180" height="42" rx="10" fill="none" stroke="#e2dddd" stroke-opacity=".32"/>
  <text x="464" y="365" font-family="Segoe UI, sans-serif" font-size="15" fill="#e2dddd">Secondary action</text>
  <text x="230" y="454" font-family="Consolas, monospace" font-size="16" fill="#80ad88">+ added line</text>
  <text x="230" y="484" font-family="Consolas, monospace" font-size="16" fill="#d17b79">− removed line</text>
  <rect x="230" y="518" width="12" height="12" rx="6" fill="#181819" stroke="#e2dddd"/>
  <text x="252" y="529" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2dddd" opacity=".7">Illustrative preview — not a Codex screenshot</text>
</svg>
