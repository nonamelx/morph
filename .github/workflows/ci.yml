name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Morph tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Check generated gallery files
        shell: pwsh
        run: ./tools/Build-Themes.ps1 -Check
